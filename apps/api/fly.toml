# Fly.io — API (staging). Region Paris. Les secrets sont poses avec `fly secrets set`, jamais ici.
app = "location-voiture-api-staging"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "4000"
  API_LOG_LEVEL = "info"
  APP_DEEP_LINK_SCHEME = "lv"
  # Staging : MFA admin desactivee tant que l app mobile n enrole pas de second facteur (SECURITY.md).
  API_ADMIN_REQUIRE_MFA = "false"

[http_service]
  internal_port = 4000
  force_https = true
  # « suspend » plutot que « stop » : la memoire du processus est conservee pendant la veille, le reveil
  # prend moins d'une seconde. Arretee, la machine rechargeait Node et ses dependances (~12 s) et le
  # proxy Fly abandonnait apres ~8 s : les utilisateurs voyaient l'application echouer (2026-09-13).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
