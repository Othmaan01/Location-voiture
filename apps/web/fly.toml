# Fly.io — site web (staging). Region Paris. Variables publiques uniquement (aucun secret).
app = "location-voiture-web-staging"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://location-voiture-api-staging.fly.dev"
    NEXT_PUBLIC_SITE_URL = "https://location-voiture-web-staging.fly.dev"
    NEXT_PUBLIC_SITE_NAME = "Location Voiture"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/robots.txt"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
